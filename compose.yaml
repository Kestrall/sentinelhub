services:
  php:
    build: docker/php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/app
    environment:
      DATABASE_URL: "mysql://sentinelhub:sentinelhub@mysql:3306/sentinelhub?serverVersion=8.4.0&charset=utf8mb4"
      MONGODB_URI: "mongodb://mongodb:27017"
      COMPOSER_HOME: /tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sentinelhub
      MYSQL_USER: sentinelhub
      MYSQL_PASSWORD: sentinelhub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mongodb:
    image: mongo:8.0
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
